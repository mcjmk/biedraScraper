[project]
name = "biedrascraper"
version = "0.1.2"
description = "Scrape latest prices from Biedronka's online sotre"
readme = "README.md"
authors = [
    { name = "Maciej Mezyk", email = "mcj.mezyk@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "selenium>=4.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
extend-select = ["E501"]
