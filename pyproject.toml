[project]
name = "biedrascraper"
version = "0.1.2"
description = "Scrape the latest prices from Biedronka's online store"
readme = "README.md"
authors = [
    { name = "Maciej Mezyk", email = "mcj.mezyk@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "selenium>=4.40.0",
]

[project.scripts]
biedrascraper = "biedrascraper.main:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "RUF",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
